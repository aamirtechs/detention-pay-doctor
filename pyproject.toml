[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detention-pay-doctor"
version = "1.0.0"
description = "Detention pay calculator for truck loads"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
detention-pay-doctor = "detention_pay_doctor:main_entry"

[tool.setuptools]
py-modules = ["detention_pay_doctor"]
